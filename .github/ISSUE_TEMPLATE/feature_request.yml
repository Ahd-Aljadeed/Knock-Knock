name: Feature request
description: Suggest a new action, setting or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Knock Knock help?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
