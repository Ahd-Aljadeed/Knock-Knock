name: Release

# Push a tag like v1.2.0 (matching the VERSION file) to publish a release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Check the tag matches VERSION
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION ($version)" }

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Test
        shell: powershell
        run: .\tests\run-tests.ps1

      - name: Release notes from CHANGELOG.md
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }
          $notes = $m.Groups[1].Value.Trim()
          $hash = (Get-Content dist\KnockKnock.exe.sha256).Split(' ')[0]
          "$notes`n`n**SHA-256** ``KnockKnock.exe``: ``$hash``" | Set-Content release-notes.md -Encoding utf8

      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist\KnockKnock.exe dist\KnockKnock.exe.sha256 `
            --title "Knock Knock ${{ github.ref_name }}" --notes-file release-notes.md
