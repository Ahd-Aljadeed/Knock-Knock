name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Test
        shell: powershell
        run: .\tests\run-tests.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: KnockKnock
          path: |
            dist/KnockKnock.exe
            dist/KnockKnock.exe.sha256
