PackageVersion: 1.0.0
PackageLocale: en-US
Publisher: Ahd-Aljadeed
PublisherUrl: https://github.com/Ahd-Aljadeed
PublisherSupportUrl: https://github.com/Ahd-Aljadeed/Knock-Knock/issues
