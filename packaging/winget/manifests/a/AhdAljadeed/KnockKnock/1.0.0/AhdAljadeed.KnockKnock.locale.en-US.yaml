License: MIT
LicenseUrl: https://github.com/Ahd-Aljadeed/Knock-Knock/blob/main/LICENSE
ShortDescription: Knock on your desk to take a screenshot or run any action.
Description: |-
  Knock Knock is a free, open-source Windows tray app that detects knocks on your desk
  through the microphone and turns them into shortcuts. Knock twice to take a screenshot,
  or set any knock count from 2 to 8 to open an app or website, press media keys, send a
  keyboard shortcut, lock the PC or run a command. Audio is never recorded or sent anywhere.
Moniker: knockknock
